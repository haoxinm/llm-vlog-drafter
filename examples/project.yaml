# Example trip-vlog configuration (DESIGN §4.1). Every field is optional; defaults shown.
project:
  title: "Trip Vlog"
  target_duration_seconds: 180
  aspect_ratio: "16:9"
  frame_rate: "30"            # number or rational, e.g. "30000/1001"
  language: "en"
  story_mode: "mostly_chronological"   # chronological | mostly_chronological | thematic
  style: "personal, cinematic, authentic"
  audience: "friends and family"
  include_narration: false
  include_subtitles: false
  music_policy: "user_supplied_only"   # none | user_supplied_only
  preserve_natural_audio: true
  target_loudness_lufs: null
  duration_tolerance_pct: 5      # total duration may differ from the target by max(5%, 2 s)
  duration_tolerance_seconds: 2

editorial:
  must_include: []
  must_exclude: []
  preferred_topics: []
  max_similar_shots_per_scene: 2
  opening_hook_seconds: 8
  closing_seconds: 10
  allow_nonlinear_hook: true
  avoid_fabricated_context: true
  avoid_excessive_transitions: true
  opening_title: false           # an opening title with project.title on V2 (your own text; both planners)
  scene_titles: false            # llm planner may show the outline's scene titles (never invented text)
  closing_title: null            # text you supply (max 60 characters); shown at the end when set
  max_titles: 6                  # most titles in one plan
  title_seconds: 3.0             # on-screen time of the opening and closing titles

media:
  recursive: true
  follow_symlinks: false
  fingerprint: "fast"            # fast | sha256
  proxy_policy: "on_demand"      # on_demand | always | never
  vision_sampling_fps: 1.0
  fine_sampling_fps: 4.0
  fine_sampling_enabled: false
  vision_max_frames_per_segment: 8   # frames beyond this are thinned evenly
  vision_input: frames               # frames | contact_sheet
  vision_batch_max_images: 16
  vision_send_filenames: true        # base name only, wrapped as untrusted data
  photo_duplicate_distance: 6
  segment_window_seconds: 6.0
  local_only: false              # true: every endpoint used by llm.text / llm.vision (and an active speech.endpoint) must be loopback
  audio_features: true           # loudness, clipped / wind-likely / silent flags per segment (one ffmpeg pass per asset)
  # Phase 1 inventory settings
  ffprobe_path: null             # else $FFPROBE, PATH, standard install dirs
  ffmpeg_path: null              # else $FFMPEG, PATH, standard install dirs
  probe_timeout_seconds: 60
  thumbnail_max_side: 480
  contact_sheet_frames: 6        # frames per video contact sheet (0 = off)
  export_gps: false              # GPS is private; keep it out of JSONL exports
  # Phase 2 segmentation / baseline planning
  segment_min_seconds: 1.5       # shorter candidate segments are merged with a neighbour
  scene_threshold: 0.30          # ffmpeg scene-cut score
  silence_threshold_db: -35      # audio below this level counts as silence
  still_duration_seconds: 3.0    # default on-screen time of a photo

speech:                          # optional transcription; backend none = skipped (see README "Speech transcription")
  enabled: true
  backend: none                  # none | openai_transcriptions | command
  language: null
  min_speech_seconds: 1.0
  audio_format: wav              # wav | flac
  keep_audio: false
  context_max_chars: 1200        # transcript text shown to the vision model per segment (0 = never)
  # endpoint: {base_url: "http://127.0.0.1:8000", api_key_env: null, model: <model name your server expects>}
  # command: {executable: /path/to/whisper-cli, args: ["-f", "{input}", "-osrt", "-of", "{output_base}"], output_format: srt}

planning:                        # LLM story outline (README "Story outline"); uses llm.text
  max_moments_in_prompt: 400     # more usable moments than this are pre-selected deterministically before the request
  transcript_excerpt_chars: 160  # verbatim speech excerpt per moment shown to the story editor (0 = none)
  cluster_gap_seconds: 300       # moments captured closer together form one time cluster (pre-selection keeps the best of each)
  outline_max_tokens: 8000       # upper bound on the reply (also capped by the endpoint's max_tokens)
  outline_retries: 1             # corrected re-asks with the validation findings before the outline stage fails
  selection_max_tokens: 12000    # upper bound on the clip-selection reply (also capped by the endpoint's max_tokens)
  selection_retries: 1           # corrected re-asks with the validation findings before the plan stage fails

workflow:
  approval: "stop_after_outline" # stop_after_outline | auto_approve
  planner: "baseline"            # baseline (no LLM); llm = outline -> approval -> LLM clip selection
  plan_review: false             # llm planner: also stop at the edit plan for review (default: it follows the approved outline)

filmcraft:
  mode: "mcp"                    # mcp | cli | bridge
  executable: null
  control_host: "127.0.0.1"
  control_port: null
  project_name: "Trip Vlog Draft"
  sequence_name: "Main Draft"
  prefer_native_project: true
  interchange_formats: ["fcp7_xml", "otio"]   # fcp7_xml primary, otio secondary; fcpxml/edl/aaf crashed or froze Resolve 21.1
  request_timeout_seconds: 120   # per FilmCraft command
  preview_scale: 1.0             # 1.0 = full size; e.g. 0.5 renders a smaller draft
  handle_policy: "error"         # dissolve without source handles: error | cut (downgrade, recorded)
  ambient_low_gain_db: -12       # gain applied to clips with audio_policy "ambient_low"

qc:
  min_still_seconds: 1.5
  black_min_seconds: 0.5
  black_picture_threshold: 0.98
  black_pixel_threshold: 0.10
  contact_sheet_columns: 4
  contact_sheet_max_frames: 48
  contact_sheet_tile_width: 320
  # Optional LLM critic (README "QC critic"). off: never runs. report: writes qc/critic_report.md. apply: also applies its validated, local fixes
  # as a new plan version and a new FilmCraft project (the earlier version is kept).
  critic: "off"                  # off | report | apply
  critic_max_rounds: 1           # apply: critic -> fix -> rebuild -> QC rounds per plan
  critic_max_ops_per_round: 3    # apply: most changes applied in one round
  critic_apply_min_severity: minor   # apply: findings below this severity are reported, never applied (minor | major)
  critic_images: true            # send the preview sheets to a vision-capable endpoint; false (or an endpoint without images) = text only
  critic_max_sheets: 4           # most preview sheet images in one request
  critic_max_tokens: 6000        # upper bound on the reply (also capped by the endpoint's max_tokens)

outputs:                         # relative to the output workspace
  project_file: "filmcraft/TripVlog.fcproj"
  preview_file: "preview/draft.mp4"
  edit_plan_file: "plans/edit_plan.json"
  interchange_dir: "resolve_handoff"

# LLM gateway (README "LLM provider"). API keys are read from the environment variable NAMED here, never from this file.
llm:
  mode: live                     # live | record | replay (env TRIP_VLOG_LLM_MODE overrides)
  text: main                     # endpoint profile for text/planning calls
  vision: main                   # endpoint profile for vision calls
  critic: null                   # endpoint profile for the QC critic; null = the vision profile (or the text profile when no image is sent)
  endpoints:
    main:
      api: anthropic_messages    # anthropic_messages | openai_chat | openai_responses
      base_url: https://api.anthropic.com
      model: null                # or the env var named by model_env; there is no built-in default
      model_env: TRIP_VLOG_LLM_MODEL
      api_key_env: ANTHROPIC_API_KEY
